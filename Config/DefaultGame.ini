[/Script/Engine.AssetManagerSettings]
; Register GameFeatureData so the engine-mounted GameFeatures plugin doesn't log
; the benign "Asset manager settings do not include a rule for assets of type
; GameFeatureData" error at startup. Game Features are not used by this project,
; but listing the type satisfies the asset-manager scan check.
+PrimaryAssetTypesToScan=(PrimaryAssetType=GameFeatureData,bHasBlueprintClasses=False,bIsEditorOnly=False)

