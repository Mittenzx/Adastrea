; Adastrea MVP Default Scalability Settings
; Capped at Balanced for consistent 60 FPS on mid-range hardware
; Last updated: August 2026

[ScalabilitySettings]
; Resolution quality (screen percentage)
; 0=Low (50%), 1=Medium (100%), 2=High (100%), 3=Epic (100%)
; MVP: 75% screen percentage for better iGPU performance (Intel Arc 140V)
r.ScreenPercentage=75
; Anti-aliasing quality
; 0=Low (FXAA), 1=Medium (TAA), 2=High (TSR), 3=Epic (TSR+Temporal)
sg.AntiAliasingQuality=2
; Shadow quality
sg.ShadowQuality=1
; Post-process quality
sg.PostProcessQuality=1
; Texture quality - keep 2 for good visuals
sg.TextureQuality=2
; Effects quality (Niagara, particles)
sg.EffectsQuality=1
; Foliage quality
sg.FoliageQuality=0
; Shading quality (simplifies lighting)
sg.ShadingQuality=2
; Global illumination quality
sg.GlobalIlluminationQuality=0
; Reflection quality
sg.ReflectionQuality=0
; View distance
sg.ViewDistanceQuality=1
; Landscale quality
sg.LandscapeQuality=0