name: Code Quality Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validation:
    name: Run Code Quality Validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Check UPROPERTY usage
        run: |
          python Tools/check_uproperty.py
        continue-on-error: false

      - name: Validate asset naming conventions
        run: |
          python Tools/validate_naming.py
        continue-on-error: true

      - name: Run comprehensive test suite
        run: |
          python tests/run_all_tests.py --verbose
        continue-on-error: false

      - name: Summary
        if: always()
        run: |
          echo "Code quality checks completed!"
          echo "Review the logs above for any issues found."
